<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <title>Time Tracker Dashboard</title>
  </head>
  <body>
    <main class="card-grid">
      <section class="profile-card">
        <div class="top-profile">
          <img
            src="image-jeremy.png"
            alt="Jeremy Robson's profile picture"
            class="profile-picture"
          />
          <div class="report-details">
            <p class="for">Report for</p>
            <h1 class="name">Jeremy Robson</h1>
          </div>
        </div>
        <div class="time-options">
          <button data-time="daily">Daily</button>
          <button data-time="weekly" class="selected">Weekly</button>
          <button data-time="monthly">Monthly</button>
        </div>
      </section>

      <section class="card-bg work">
        <div class="card-details">
          <div class="card-title">
            <h3 class="single-card-title">Work</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">32hrs</span>
            <span class="time-period">Last Week - 36hrs</span>
          </div>
        </div>
      </section>
      <section class="card-bg play">
        <div class="card-details">
          <div class="card-title">
            <h3>Play</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">10hrs</span>
            <span class="time-period">Last Week - 36hrs</span>
          </div>
        </div>
      </section>
      <section class="card-bg study">
        <div class="card-details">
          <div class="card-title">
            <h3>Study</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">4hrs</span>
            <span class="time-period">Last Week - 7hrs</span>
          </div>
        </div>
      </section>
      <section class="card-bg exercise">
        <div class="card-details">
          <div class="card-title">
            <h3>Exercise</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">4hrs</span>
            <span class="time-period">Last Week - 5hrs</span>
          </div>
        </div>
      </section>
      <section class="card-bg social">
        <div class="card-details">
          <div class="card-title">
            <h3>Social</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">5hrs</span>
            <span class="time-period">Last Week - 10hrs</span>
          </div>
        </div>
      </section>
      <section class="card-bg self-care">
        <div class="card-details">
          <div class="card-title">
            <h3>Self Care</h3>
            <img src="icon-ellipsis.svg" alt="Settings" />
          </div>
          <div class="time-details">
            <span class="hours">2hrs</span>
            <span class="time-period">Last Week - 2hrs</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
